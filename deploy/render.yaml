services:
  - type: web
    name: redorigin-guide
    runtime: python
    plan: free
    region: singapore
    buildCommand: "python -V"
    startCommand: "python run.py --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: PYTHONUNBUFFERED
        value: "1"
