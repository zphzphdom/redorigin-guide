services:
  - type: web
    name: redorigin-guide
    runtime: python
    plan: free
    region: singapore
    buildCommand: "python -V"
    startCommand: "python run.py --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: PYTHONUNBUFFERED
        value: "1"
      # 部署时在 Render 面板填写，不写入仓库
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: REDORIGIN_SEARCH
        value: "1"
